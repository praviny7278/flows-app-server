# Reference load balancer config for the API (see docker-compose.yml).
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  gzip on;
  gzip_types text/plain application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;

  # Edge rate limiting: first line of defense before Node.
  limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_rl:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=addr_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream flowops_api {
    least_conn;
    # With `docker compose up --scale api=N`, compose's DNS returns all replica
    # addresses at startup. Reload nginx (`nginx -s reload`) after changing scale.
    server api:4000;
    keepalive 64;
  }

  server {
    listen 80;

    # Unauthenticated health endpoint used by the LB and container health checks.
    location = /health {
      proxy_pass http://flowops_api;
      proxy_set_header Host $host;
    }

    # Stricter edge limit for credential endpoints (brute-force defense in depth).
    location /api/v1/auth/ {
      limit_req zone=auth_rl burst=10 nodelay;
      limit_conn addr_conn 32;
      proxy_pass http://flowops_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }

    location / {
      limit_req zone=api_rl burst=60 nodelay;
      limit_conn addr_conn 64;
      proxy_pass http://flowops_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}
